services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ai_research_hub
      POSTGRES_USER: ai_research_hub
      POSTGRES_PASSWORD: ai_research_hub_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_research_hub -d ai_research_hub"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:

